<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>US AI Legislation Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title">US AI Legislation Map</div>
      <div class="subtitle">State-level AI laws, bills and guidance · current as of Oct 13, 2026</div>
    </div>

    <div class="controls">
      <label>
        Sector
        <select id="sectorFilter">
          <option value="all">All</option>
          <option value="healthcare">Healthcare</option>
          <option value="employment">Employment</option>
          <option value="biometrics">Biometrics</option>
          <option value="synthetic_media">Synthetic media</option>
          <option value="consumer_transparency">Consumer transparency</option>
          <option value="chatbots">Chatbots &amp; AI companions</option>
          <option value="comprehensive">Comprehensive / algorithmic discrimination</option>
          <option value="frontier_models">Frontier AI safety</option>
          <option value="government">Government use of AI</option>
        </select>
      </label>

      <div class="checks">
        <label><input type="checkbox" class="statusFilter" value="passed" checked /> Passed</label>
        <label><input type="checkbox" class="statusFilter" value="pending" checked /> Pending</label>
        <label><input type="checkbox" class="statusFilter" value="guidance" checked /> Guidance</label>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <footer class="footer">
    <span id="count"></span>
    <span class="muted">Tip: hover (desktop) or tap (mobile) a marker for details and sources. States with several entries show a cluster of markers around the capital.</span>
  </footer>

  <div class="legend">
    <div><span class="dot passed"></span> Passed</div>
    <div><span class="dot pending"></span> Pending</div>
    <div><span class="dot guidance"></span> Guidance</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./data/hubs.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
