<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>US AI Legislation Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title">US AI Legislation Map</div>
      <div class="subtitle">State-level AI laws, bills and guidance · current as of Oct 13, 2026</div>
    </div>

    <div class="controls">
      <label>
        Sector
        <select id="sectorFilter">
          <option value="all">All</option>
          <option value="healthcare">Healthcare</option>
          <option value="employment">Employment</option>
          <option value="biometrics">Biometrics</option>
          <option value="synthetic_media">Synthetic media</option>
          <option value="consumer_transparency">Consumer transparency</option>
          <option value="chatbots">Chatbots &amp; AI companions</option>
          <option value="comprehensive">Comprehensive / algorithmic discrimination</option>
          <option value="frontier_models">Frontier AI safety</option>
          <option value="government">Government use of AI</option>
        </select>
      </label>

      <div class="checks">
        <label class="status-label passed" title="Enacted into law (may not be in effect yet)"><input type="checkbox" class="statusFilter" value="passed" checked /> Passed</label>
        <label class="status-label pending" title="Bill still moving through the legislature or awaiting signature"><input type="checkbox" class="statusFilter" value="pending" checked /> Pending</label>
        <label class="status-label guidance" title="Not a statute: executive orders, AG advisories, agency rules or policies"><input type="checkbox" class="statusFilter" value="guidance" checked /> Guidance</label>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <footer class="footer">
    <span id="count"></span>
    <span class="muted"><b class="c-passed">Passed</b> = enacted law · <b class="c-pending">Pending</b> = bill not yet law · <b class="c-guidance">Guidance</b> = executive orders, AG advisories, agency rules. Hover or tap a marker for details.</span>
  </footer>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./data/hubs.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
